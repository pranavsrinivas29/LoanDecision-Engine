name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  backend-quality:
    name: Backend Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create required runtime folders
        run: |
          mkdir -p data/raw
          mkdir -p data/processed
          mkdir -p artifacts
          mkdir -p artifacts/drift
          mkdir -p artifacts/retraining
          mkdir -p logs
          mkdir -p models
          mkdir -p mlruns
          mkdir -p knowledge_base
          mkdir -p monitoring
          touch monitoring/prometheus.yml

      - name: Create minimal .env for CI
        run: |
          cat > .env <<EOF
          APP_ENV=ci
          API_HOST=0.0.0.0
          API_PORT=8000
          STREAMLIT_SERVER_PORT=8501
          MLFLOW_TRACKING_URI=file:./mlruns
          MLFLOW_EXPERIMENT_NAME=loan_approval_training
          DATABASE_URL=sqlite:///./artifacts/loan_agent.db
          DATA_DIR=./data
          ARTIFACTS_DIR=./artifacts
          MODEL_DIR=./models
          LOG_DIR=./logs
          KNOWLEDGE_BASE_DIR=./knowledge_base
          OPENAI_API_KEY=dummy-key
          OPENAI_MODEL_NAME=gpt-4.1-mini
          TOP_K_RETRIEVAL=3
          LOCAL_EXPLANATION_TOP_N=5
          PREDICTION_THRESHOLD=0.5
          DRIFT_MONITOR_WINDOW_SIZE=100
          MIN_RECORDS_FOR_DRIFT_CHECK=50
          ENABLE_AUTO_RETRAIN_ON_DRIFT=false
          EOF

      - name: Set up Python cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements/api.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/api.txt
          pip install ruff pytest

      - name: Lint backend
        run: |
          ruff check src

      - name: Smoke test imports
        run: |
          python -c "from src.api.main import app; print(app.title)"
          python -c "from src.config import settings as s; print('settings import ok')"

      - name: Smoke test routes
        run: |
          python -c "from src.api.routes.predict import router; print('predict route ok')"
          python -c "from src.api.routes.explain import router; print('explain route ok')"
          python -c "from src.api.routes.summarize import router; print('summarize route ok')"
          python -c "from src.api.routes.drift import router; print('drift route ok')"
          python -c "from src.api.routes.retraining import router; print('retraining route ok')"

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: backend-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create required runtime folders
        run: |
          mkdir -p data/raw
          mkdir -p data/processed
          mkdir -p artifacts
          mkdir -p artifacts/drift
          mkdir -p artifacts/retraining
          mkdir -p logs
          mkdir -p models
          mkdir -p mlruns
          mkdir -p mlflow
          mkdir -p knowledge_base
          mkdir -p monitoring
          mkdir -p grafana

      - name: Create Prometheus config
        run: |
          cat > monitoring/prometheus.yml <<EOF
          global:
            scrape_interval: 5s
            evaluation_interval: 5s

          scrape_configs:
            - job_name: "fastapi-backend"
              metrics_path: /metrics
              static_configs:
                - targets: ["backend:8000"]

            - job_name: "prometheus"
              static_configs:
                - targets: ["prometheus:9090"]
          EOF

      - name: Create minimal .env for Docker build
        run: |
          cat > .env <<EOF
          APP_ENV=ci
          API_HOST=0.0.0.0
          API_PORT=8000
          STREAMLIT_SERVER_PORT=8501
          MLFLOW_TRACKING_URI=http://mlflow:5000
          MLFLOW_EXPERIMENT_NAME=loan_approval_training
          DATABASE_URL=sqlite:///./artifacts/loan_agent.db
          DATA_DIR=/app/data
          ARTIFACTS_DIR=/app/artifacts
          MODEL_DIR=/app/models
          LOG_DIR=/app/logs
          KNOWLEDGE_BASE_DIR=/app/knowledge_base
          OPENAI_API_KEY=dummy-key
          OPENAI_MODEL_NAME=gpt-4.1-mini
          TOP_K_RETRIEVAL=3
          LOCAL_EXPLANATION_TOP_N=5
          PREDICTION_THRESHOLD=0.5
          DRIFT_MONITOR_WINDOW_SIZE=100
          MIN_RECORDS_FOR_DRIFT_CHECK=50
          ENABLE_AUTO_RETRAIN_ON_DRIFT=false
          EOF

      - name: Build backend image
        run: docker build -f src/docker/Dockerfile.api -t loan-agent-backend .

      - name: Build frontend image
        run: docker build -f src/docker/Dockerfile.frontend -t loan-agent-frontend .

      - name: Build mlflow image
        run: docker build -f src/docker/Dockerfile.mlflow -t loan-agent-mlflow .

      - name: Build prefect image
        run: docker build -f src/docker/Dockerfile.prefect -t loan-agent-prefect .

  docker-compose-validate:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create required runtime folders
        run: |
          mkdir -p data/raw
          mkdir -p data/processed
          mkdir -p artifacts
          mkdir -p artifacts/drift
          mkdir -p artifacts/retraining
          mkdir -p logs
          mkdir -p models
          mkdir -p mlruns
          mkdir -p mlflow
          mkdir -p knowledge_base
          mkdir -p monitoring
          mkdir -p grafana

      - name: Create Prometheus config
        run: |
          cat > monitoring/prometheus.yml <<EOF
          global:
            scrape_interval: 5s
            evaluation_interval: 5s

          scrape_configs:
            - job_name: "fastapi-backend"
              metrics_path: /metrics
              static_configs:
                - targets: ["backend:8000"]

            - job_name: "prometheus"
              static_configs:
                - targets: ["prometheus:9090"]
          EOF

      - name: Create .env
        run: |
          cat > .env <<EOF
          APP_ENV=ci
          API_HOST=0.0.0.0
          API_PORT=8000
          STREAMLIT_SERVER_PORT=8501
          MLFLOW_TRACKING_URI=http://mlflow:5000
          MLFLOW_EXPERIMENT_NAME=loan_approval_training
          DATABASE_URL=sqlite:///./artifacts/loan_agent.db
          DATA_DIR=/app/data
          ARTIFACTS_DIR=/app/artifacts
          MODEL_DIR=/app/models
          LOG_DIR=/app/logs
          KNOWLEDGE_BASE_DIR=/app/knowledge_base
          OPENAI_API_KEY=dummy-key
          OPENAI_MODEL_NAME=gpt-4.1-mini
          TOP_K_RETRIEVAL=3
          LOCAL_EXPLANATION_TOP_N=5
          PREDICTION_THRESHOLD=0.5
          DRIFT_MONITOR_WINDOW_SIZE=100
          MIN_RECORDS_FOR_DRIFT_CHECK=50
          ENABLE_AUTO_RETRAIN_ON_DRIFT=false
          EOF

      - name: Validate docker compose config
        run: docker compose config

      - name: Start core services
        run: |
          docker compose up -d backend mlflow prometheus grafana
          sleep 20

      - name: Show running containers
        run: docker ps

      - name: Print backend logs
        if: always()
        run: docker compose logs backend

      - name: Print mlflow logs
        if: always()
        run: docker compose logs mlflow

      - name: Stop services
        if: always()
        run: docker compose down -v