name: CD - Publish Docker Images to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish-images:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract backend image metadata
        id: backend_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/loan-approval-agent-backend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Extract frontend image metadata
        id: frontend_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/loan-approval-agent-frontend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Extract mlflow image metadata
        id: mlflow_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/loan-approval-agent-mlflow
          tags: |
            type=raw,value=latest
            type=sha

      - name: Extract prefect image metadata
        id: prefect_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/loan-approval-agent-prefect
          tags: |
            type=raw,value=latest
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/docker/Dockerfile.api
          push: true
          tags: ${{ steps.backend_meta.outputs.tags }}
          labels: ${{ steps.backend_meta.outputs.labels }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/docker/Dockerfile.frontend
          push: true
          tags: ${{ steps.frontend_meta.outputs.tags }}
          labels: ${{ steps.frontend_meta.outputs.labels }}

      - name: Build and push mlflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/docker/Dockerfile.mlflow
          push: true
          tags: ${{ steps.mlflow_meta.outputs.tags }}
          labels: ${{ steps.mlflow_meta.outputs.labels }}

      - name: Build and push prefect image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/docker/Dockerfile.prefect
          push: true
          tags: ${{ steps.prefect_meta.outputs.tags }}
          labels: ${{ steps.prefect_meta.outputs.labels }}